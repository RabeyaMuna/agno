name: Validation

on: push

jobs:
  style-check:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.9']

    defaults:
      run:
        working-directory: libs/agno
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
    - name: Install dependencies
      run: |
        python -m pip install --upgrade \
          pip setuptools wheel \
          "ruff==0.11.10" "mypy==1.15.0" pytest types-pyyaml
        pip install --no-deps -r requirements.txt
    - name: Ruff format
      run: |
        ruff format .
    - name: Ruff check
      run: |
        ruff check . --target-version py39
    - name: Confirm mypy version
      run: |
        mypy --version
    - name: Mypy
      run: |
        mypy .
  tests:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.12']
    env:
      UV_EXCLUDE_NEWER: '2025-07-29T00:00:00Z'
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      run: |
        set -e
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
    - name: Run dev setup
      working-directory: .
      run: |
        set -e
        ./scripts/dev_setup.sh
    - name: Pin zep-cloud to working version
      run: |
        VIRTUAL_ENV=.venv uv pip install --no-deps --force-reinstall "zep-cloud==2.22.1"

    - name: Run tests for Agno
      working-directory: .
      run: |-
        source .venv/bin/activate
        python -m pytest --cov=agno --cov-report=json:coverage-agno.json ./libs/agno/tests/unit
        echo "AGNO_COVERAGE=$(python -c 'import json; print(json.load(open("coverage-agno.json"))["totals"]["percent_covered_display"])')" >> $GITHUB_ENV
