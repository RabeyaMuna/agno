name: Validation

on: push

jobs:
  style-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9']

    defaults:
      run:
        working-directory: libs/agno

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel ruff mypy pytest types-pyyaml
        pip install --no-deps -r requirements.txt

    - name: Ruff format
      run: |
        ruff format .

    - name: Ruff check
      run: |
        ruff check . --target-version py39

    - name: Confirm mypy version
      run: |
        mypy --version

    - name: Mypy
      run: |
        mypy .

  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      run: |
        set -e
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Run dev setup
      working-directory: .
      run: |
        set -e
        ./scripts/dev_setup.sh

    - name: Pin zep-cloud
      run: |
        VIRTUAL_ENV=.venv uv pip install "zep-cloud==2.22.1"

    - name: Apply py312 constraints
      run: |
        set -e
        cat > constraints-py312.txt <<'EOF'
        numpy==1.26.4
        numba==0.63.1
        llvmlite==0.46.0

        pinecone==5.4.2
        chromadb==0.5.0
        couchbase==4.5.0

        google-genai==1.17.0
        firecrawl-py==4.14.0
        mcp==1.9.2
        EOF

        VIRTUAL_ENV=.venv uv pip install -c constraints-py312.txt \
          numpy numba llvmlite pinecone chromadb couchbase google-genai firecrawl-py mcp

    - name: Ensure test tooling
      run: |
        set -e
        VIRTUAL_ENV=.venv uv pip install -c constraints-py312.txt \
          pytest pytest-cov pytest-asyncio pytest-mock

    - name: Install optional deps required by unit tests
      run: |
        set -e
        VIRTUAL_ENV=.venv uv pip install -c constraints-py312.txt \
          openai redis fastapi aiofiles python-docx pypdf youtube-transcript-api \
          arxiv duckduckgo-search \
          google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib \
          google-cloud-storage google-cloud-bigquery \
          groq agentql browserbase playwright cartesia atlassian-python-api exa-py \
          PyGithub todoist-api-python webexpythonsdk \
          clickhouse-connect lancedb pymilvus qdrant-client weaviate-client \
          cassandra-driver cassio pymongo sqlalchemy pgvector \
          mem0ai

    - name: Run tests for Agno
      working-directory: .
      run: |
        set -e
        .venv/bin/python -m pytest --cov=agno --cov-report=json:coverage-agno.json ./libs/agno/tests/unit
        echo "AGNO_COVERAGE=$(.venv/bin/python -c "import json; print(json.load(open('coverage-agno.json'))['totals']['percent_covered_display'])")" >> "$GITHUB_ENV"
